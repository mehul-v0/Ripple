<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="400" fill="#fff"/>
<text x="34" y="30" font-size="17" font-weight="600" fill="#12161f">Cost of a one-line change to a large file</text>
<text x="34" y="50" font-size="12" fill="#6b7688">Content-defined chunking means only the chunks containing the edit are new.</text>
<line x1="78" y1="326.0" x2="730" y2="326.0" stroke="#e3e7ee"/>
<text x="69" y="329.5" font-size="11" fill="#6b7688" text-anchor="end">0</text>
<line x1="78" y1="275.6" x2="730" y2="275.6" stroke="#e3e7ee"/>
<text x="69" y="279.1" font-size="11" fill="#6b7688" text-anchor="end">965k</text>
<line x1="78" y1="225.2" x2="730" y2="225.2" stroke="#e3e7ee"/>
<text x="69" y="228.7" font-size="11" fill="#6b7688" text-anchor="end">2M</text>
<line x1="78" y1="174.8" x2="730" y2="174.8" stroke="#e3e7ee"/>
<text x="69" y="178.3" font-size="11" fill="#6b7688" text-anchor="end">3M</text>
<line x1="78" y1="124.4" x2="730" y2="124.4" stroke="#e3e7ee"/>
<text x="69" y="127.9" font-size="11" fill="#6b7688" text-anchor="end">4M</text>
<line x1="78" y1="74.0" x2="730" y2="74.0" stroke="#e3e7ee"/>
<text x="69" y="77.5" font-size="11" fill="#6b7688" text-anchor="end">5M</text>
<rect x="139.1" y="106.9" width="203.8" height="219.1" rx="3" fill="#2563eb"/>
<text x="241.0" y="99.9" font-size="11.5" font-weight="600" fill="#12161f" text-anchor="middle">4.2 MB</text>
<text x="241.0" y="346" font-size="11" fill="#6b7688" text-anchor="middle">whole file</text>
<rect x="465.1" y="325.6" width="203.8" height="0.4" rx="3" fill="#dc2626"/>
<text x="567.0" y="318.6" font-size="11.5" font-weight="600" fill="#12161f" text-anchor="middle">0.0 MB</text>
<text x="567.0" y="346" font-size="11" fill="#6b7688" text-anchor="middle">actually transferred</text>
<text transform="translate(20,200.0) rotate(-90)" font-size="11.5" fill="#12161f" text-anchor="middle">bytes</text>
</svg>