<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="430" fill="#fff"/>
<text x="34" y="30" font-size="17" font-weight="600" fill="#12161f">Bytes sent by the publisher as the cluster grows</text>
<text x="34" y="50" font-size="12" fill="#6b7688">Measured on a real cluster. Star topology sends the file once per node; Ripple lets every node that holds a chunk serve it.</text>
