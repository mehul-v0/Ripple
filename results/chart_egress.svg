<text x="69" y="309.5" font-size="11" fill="#6b7688" text-anchor="end">4M</text>
<line x1="78" y1="248.0" x2="730" y2="248.0" stroke="#e3e7ee"/>
<text x="69" y="251.5" font-size="11" fill="#6b7688" text-anchor="end">8M</text>
<line x1="78" y1="190.0" x2="730" y2="190.0" stroke="#e3e7ee"/>
<text x="69" y="193.5" font-size="11" fill="#6b7688" text-anchor="end">13M</text>
<line x1="78" y1="132.0" x2="730" y2="132.0" stroke="#e3e7ee"/>
<text x="69" y="135.5" font-size="11" fill="#6b7688" text-anchor="end">17M</text>
<line x1="78" y1="74.0" x2="730" y2="74.0" stroke="#e3e7ee"/>
<text x="69" y="77.5" font-size="11" fill="#6b7688" text-anchor="end">21M</text>
<text x="78.0" y="384" font-size="11" fill="#6b7688" text-anchor="middle">3</text>
<text x="357.4" y="384" font-size="11" fill="#6b7688" text-anchor="middle">6</text>
<text x="730.0" y="384" font-size="11" fill="#6b7688" text-anchor="middle">10</text>
<line x1="78" y1="364" x2="730" y2="364" stroke="#c3cad6"/>
<text x="404.0" y="406" font-size="11.5" fill="#12161f" text-anchor="middle">nodes in cluster</text>
<text transform="translate(20,219.0) rotate(-90)" font-size="11.5" fill="#12161f" text-anchor="middle">bytes out of the source</text>
<polyline fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" points="78.0,330.9 357.4,322.9 730.0,305.3"/>
<circle cx="78.0" cy="330.9" r="3.6" fill="#fff" stroke="#2563eb" stroke-width="2.2"/>
