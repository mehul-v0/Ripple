<text x="724.0" y="294.3" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="end">Ripple (swarm)</text>
<polyline fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" points="78.0,306.5 357.4,220.2 730.0,105.1"/>
<circle cx="78.0" cy="306.5" r="3.6" fill="#fff" stroke="#dc2626" stroke-width="2.2"/>
